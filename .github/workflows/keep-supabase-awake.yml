# Supabase pauses free projects after 1 week without activity. The club plays weekly,
# so this makes a small read every 3 days to keep the project awake.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row through the public API
        run: |
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://vhvlhuimelqsnglhayxs.supabase.co/rest/v1/players?select=id&limit=1" \
            -H "apikey: sb_publishable_6FJw1grb2MG0LjjkoDeKjg_WfqihrZu"
