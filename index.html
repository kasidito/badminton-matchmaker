<section id="gate" class="gate" hidden></section>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="brand">
      <span class="logo"><svg class="ico" aria-hidden="true"><use href="#i-shuttle"/></svg></span>
      <div style="min-width:0"><h1>Budmintan</h1><span class="date" id="date"></span></div>
    </div>
    <div class="hicons">
      <button class="sync" id="syncPill" data-act="sync" aria-live="polite"></button>
      <button class="hbtn" id="undoBtn" data-act="undo" aria-label="ย้อนกลับ" title="ย้อนกลับ" disabled><svg class="ico" aria-hidden="true"><use href="#i-undo"/></svg></button>
      <button class="hbtn" id="themeBtn" data-act="theme-toggle" aria-label="สลับโหมดมืด/สว่าง" title="สลับโหมดมืด/สว่าง"><svg class="ico" aria-hidden="true"><use href="#i-moon"/></svg></button>
      <button class="hbtn" id="setBtn" data-act="tab" data-tab="set" aria-label="ตั้งค่า" title="ตั้งค่า"><svg class="ico" aria-hidden="true"><use href="#i-gear"/></svg></button>
    </div>
    <nav class="tabs" aria-label="เมนู">
      <button class="tab" data-act="tab" data-tab="play"><svg class="ico" aria-hidden="true"><use href="#i-court"/></svg>สนาม</button>
      <button class="tab" data-act="tab" data-tab="people"><svg class="ico" aria-hidden="true"><use href="#i-users"/></svg>ผู้เล่น</button>
      <button class="tab" data-act="tab" data-tab="rank"><svg class="ico" aria-hidden="true"><use href="#i-trophy"/></svg>อันดับ</button>
      <button class="tab" data-act="tab" data-tab="sum"><svg class="ico" aria-hidden="true"><use href="#i-chart"/></svg>สรุป</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="dock" id="dock" hidden></div>
